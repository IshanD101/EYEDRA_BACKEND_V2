spring.application.name=community-service-api

server.port=8083

spring.data.mongodb.uri=mongodb://localhost:27017/eyedra_chat_db
spring.data.mongodb.auto-index-creation=true

# JWT Configuration
jwt.jwtSecret=ThisIsA32ByteLongSecretKeyForJWT!!

#user-service-api.url = http://localhost:8080

spring.mvc.async.request-timeout=30000

logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
logging.level.org.springframework.data.mongodb=INFO
logging.level.com.yourapp=DEBUG

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized

spring.mvc.cors.allowed-origins=*
spring.mvc.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.mvc.cors.allowed-headers=*
spring.mvc.cors.exposed-headers=Authorization

# Service Discovery (if using microservices with service discovery)
# eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/
# eureka.instance.preferIpAddress=true